    <script>
      // Suppress harmless dev-only Vite HMR websocket reconnection warning
      (function () {
        const origWarn = console.warn;
        const origError = console.error;
        const isViteWs = (args) =>
          args.some(
            (a) =>
              typeof a === 'string' &&
              (a.includes('[vite] failed to connect to websocket') ||
                a.includes('failed to connect to websocket'))
          );
        console.warn = function (...args) {
          if (isViteWs(args)) return;
          origWarn.apply(console, args);
        };
        console.error = function (...args) {
          if (isViteWs(args)) return;
          origError.apply(console, args);
        };
      })();
    </script>
